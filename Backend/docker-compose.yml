version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: lexscan_user
      POSTGRES_PASSWORD: lexscan_password
      POSTGRES_DB: lexscan_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
